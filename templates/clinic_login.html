<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clinic Login — GIL CLINIC</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #f0fdf4;
            --card: #ffffff;
            --border: rgba(0,0,0,0.08);
            --text: #1e293b;
            --text-muted: #64748b;
            --primary: #22c55e;
            --primary-hover: #16a34a;
            --danger: #ef4444;
            --radius: 14px;
        }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: linear-gradient(135deg, #f0fdf4, #dcfce7, #f0fdf4);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 420px;
        }
        .logo-area {
            text-align: center;
            margin-bottom: 28px;
        }
        .logo-area .icon { font-size: 48px; margin-bottom: 8px; }
        .logo-area h1 { font-size: 24px; font-weight: 800; color: #065f46; }
        .logo-area p { color: #64748b; font-size: 14px; margin-top: 4px; }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 32px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.06);
        }
        .card h2 {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .card .subtitle {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 20px;
        }

        .alert {
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 16px;
            display: flex;
            align-items: flex-start;
            gap: 8px;
            line-height: 1.4;
        }
        .alert-danger {
            background: rgba(239,68,68,0.08);
            border: 1px solid rgba(239,68,68,0.3);
            color: #dc2626;
        }

        .form-group { margin-bottom: 16px; }
        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .form-group input {
            width: 100%;
            padding: 12px 14px;
            border: 1.5px solid var(--border);
            border-radius: 8px;
            font-size: 16px;
            font-family: inherit;
            color: var(--text);
            background: #f8fafc;
            transition: border-color 0.2s;
            text-align: center;
            letter-spacing: 1px;
        }
        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
            background: white;
            box-shadow: 0 0 0 3px rgba(34,197,94,0.15);
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-primary {
            background: var(--primary);
            color: white;
        }
        .btn-primary:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(34,197,94,0.3);
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #64748b;
            text-decoration: none;
            font-size: 13px;
        }
        .back-link:hover { color: var(--text); }

        .info-box {
            background: #f8fafc;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px;
            margin-top: 16px;
            font-size: 12px;
            color: var(--text-muted);
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-area">
            <div class="icon">🏥</div>
            <h1>GIL CLINIC</h1>
            <p>Clinic Portal Login</p>
        </div>

        <div class="card">
            <h2>🔑 Clinic Login</h2>
            <p class="subtitle">Enter credentials provided by your admin</p>

            {% if error %}
            <div class="alert alert-danger">
                <span>⚠️</span>
                <span>{{ error }}</span>
            </div>
            {% endif %}

            <form method="POST" action="/clinic/login">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" name="username" placeholder="e.g., DrGill-Clinic-001" required autofocus autocomplete="username">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" name="password" placeholder="Enter clinic password" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn btn-primary">
                    🏥 Login to Clinic
                </button>
            </form>

            <div class="info-box">
                🔐 <strong>No credentials?</strong> Contact your Super Admin / CEO to get your clinic username & password.
            </div>
        </div>

        <a href="/" class="back-link">← Back to Home</a>
    </div>
</body>
</html>
