<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart OPD — {{ settings.doc_name or 'Doctor' }}</title>
    <script>
    // Doctor ki apni AI key server se aayi hai → is browser ke localStorage me
    // sync karo, taaki browser-side BYOK (DeepSeek/Groq/Gemini) seedha chale
    // aur Puter popup/tab ki zaroorat hi na pade (PA free fix).
    try {
        var _rawKeys = {{ raw_ai_keys | tojson }};
        Object.keys(_rawKeys || {}).forEach(function (p) {
            var k = String(_rawKeys[p] || '').trim();
            if (k) { try { localStorage.setItem('gilclinic.byok.' + p, k); } catch (e) {} }
        });
    } catch (e) {}
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #e8f4fd;
            --card: #ffffff;
            --card-hover: #f0f7ff;
            --border: rgba(0,0,0,0.08);
            --text: #1e293b;
            --text-muted: #64748b;
            --primary: #3b82f6;
            --primary-glow: rgba(59,130,246,0.15);
            --success: #22c55e;
            --warning: #eab308;
            --danger: #ef4444;
            --radius: 12px;
        }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }
        /* ── Layout ── */
        .app { display: flex; min-height: 100vh; }
        .sidebar {
            width: 240px;
            background: var(--card);
            border-right: 1px solid var(--border);
            padding: 20px 0;
            display: flex;
            flex-direction: column;
            position: sticky;
            top: 0;
            height: 100vh;
        }
        .main { flex: 1; overflow-y: auto; }
        .content { padding: 24px 32px; max-width: 1200px; }

        /* ── Sidebar ── */
        .sb-header { padding: 0 20px 16px; border-bottom: 1px solid var(--border); margin-bottom: 8px; }
        .sb-header h2 { font-size: 16px; font-weight: 600; }
        .sb-header .role-badge {
            display: inline-block;
            background: rgba(59,130,246,0.12);
            color: #2563eb;
            font-size: 11px;
            padding: 2px 10px;
            border-radius: 20px;
            margin-top: 4px;
        }
        .sb-header .doctor-name { color: var(--text-muted); font-size: 12px; margin-top: 2px; }
        .nav-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 20px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 14px;
            transition: all 0.15s;
            cursor: pointer;
            border: none;
            background: none;
            width: 100%;
            text-align: left;
        }
        .nav-item:hover { background: rgba(59,130,246,0.06); color: var(--primary); }
        .nav-item.active { background: rgba(59,130,246,0.1); color: var(--primary); border-right: 2px solid var(--primary); }
        .nav-item .icon { font-size: 18px; }
        .sb-footer { margin-top: auto; padding: 16px 20px; border-top: 1px solid var(--border); }
        .sb-footer a { color: var(--text-muted); text-decoration: none; font-size: 13px; display: flex; align-items: center; gap: 8px; }
        .sb-footer a:hover { color: var(--danger); }

        /* ── Cards ── */
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px;
            margin-bottom: 16px;
        }
        .card-title { font-size: 14px; font-weight: 600; color: var(--text-muted); margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.5px; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 24px; }
        .stat-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 16px;
            text-align: center;
        }
        .stat-card .value { font-size: 28px; font-weight: 700; }
        .stat-card .label { font-size: 12px; color: var(--text-muted); margin-top: 4px; }

        /* ── Forms ── */
        input, textarea, select {
            background: rgba(255,255,255,0.06);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px 14px;
            color: var(--text);
            font-size: 14px;
            font-family: inherit;
            outline: none;
            width: 100%;
            transition: border 0.15s;
        }
        input:focus, textarea:focus, select:focus { border-color: var(--primary); }
        textarea { resize: vertical; min-height: 60px; font-family: inherit; }
        label { display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 4px; font-weight: 500; }
        .form-group { margin-bottom: 14px; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .form-row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            border: none;
            cursor: pointer;
            transition: all 0.15s;
            font-family: inherit;
        }
        .btn-primary { background: var(--primary); color: #fff; }
        .btn-primary:hover { filter: brightness(1.1); }
        .btn-success { background: var(--success); color: #fff; }
        .btn-warning { background: var(--warning); color: #000; }
        .btn-danger { background: var(--danger); color: #fff; }
        .btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--text); }
        .btn-ghost:hover { background: rgba(255,255,255,0.06); }
        .btn-sm { padding: 6px 12px; font-size: 12px; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        /* ── Tabs ── */
        .tabs { display: flex; gap: 4px; margin-bottom: 24px; border-bottom: 1px solid var(--border); padding-bottom: 0; }
        .tab {
            padding: 10px 20px;
            border: none;
            background: none;
            color: var(--text-muted);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all 0.15s;
        }
        .tab:hover { color: var(--text); }
        .tab.active { color: var(--primary); border-bottom-color: var(--primary); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* ── Table ── */
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; font-size: 12px; color: var(--text-muted); padding: 8px 12px; border-bottom: 1px solid var(--border); font-weight: 600; }
        td { padding: 10px 12px; border-bottom: 1px solid var(--border); font-size: 13px; }
        tr:hover td { background: rgba(59,130,246,0.03); }

        /* ── Drug Quick Buttons (Upgrade 3) ── */
        .drug-btn-wrap {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 6px;
            min-height: 0;
            transition: min-height 0.15s;
        }
        .drug-btn-wrap:empty { display: none; }
        .drug-btn {
            font-size: 12px;
            padding: 4px 12px;
            border-radius: 16px;
            border: 1px solid #bfdbfe;
            background: #eff6ff;
            color: #1d4ed8;
            cursor: pointer;
            transition: all 0.1s;
            white-space: nowrap;
        }
        .drug-btn:hover { background: #dbeafe; border-color: #60a5fa; transform: translateY(-1px); }
        .drug-btn:active { transform: translateY(0); background: #bfdbfe; }
        }
        .autocomplete-item:hover { background: rgba(59,130,246,0.1); }

        /* ── Badge ── */
        .badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: 500; }
        .badge-success { background: rgba(34,197,94,0.12); color: #15803d; }
        .badge-warning { background: rgba(234,179,8,0.12); color: #a16207; }

        /* ── Toast ── */
        .toast {
            position: fixed;
            bottom: 24px; right: 24px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 14px 20px;
            font-size: 14px;
            z-index: 1000;
            display: none;
            animation: slideIn 0.3s ease;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
        }
        .toast.show { display: block; }
        .toast.success { border-color: var(--success); }
        .toast.error { border-color: var(--danger); }
        @keyframes slideIn { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        /* ── Misc ── */
        .flex { display: flex; align-items: center; gap: 8px; }
        .flex-between { display: flex; justify-content: space-between; align-items: center; }
        .gap-sm { gap: 8px; }
        .gap-md { gap: 16px; }
        .mt-sm { margin-top: 8px; }
        .mt-md { margin-top: 16px; }
        .mb-sm { margin-bottom: 8px; }
        .text-muted { color: var(--text-muted); }
        .text-sm { font-size: 12px; }
        .w-full { width: 100%; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

        /* Prescription output */
        .rx-output {
            background: rgba(0,0,0,0.02);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            line-height: 1.6;
            white-space: pre-wrap;
            min-height: 120px;
        }
        .investigation-btns { display: flex; flex-wrap: wrap; gap: 6px; }
        .investigation-btns button {
            padding: 4px 10px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: rgba(0,0,0,0.02);
            color: var(--text);
            font-size: 12px;
            cursor: pointer;
            transition: all 0.1s;
        }
        .investigation-btns button:hover { background: rgba(59,130,246,0.15); border-color: var(--primary); }
        .investigation-btns button.active { background: rgba(59,130,246,0.2); border-color: var(--primary); }

        /* Loading spinner */
        .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.6s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes pulse-btn { 0%, 100% { box-shadow: 0 4px 14px rgba(5,150,105,0.35); } 50% { box-shadow: 0 4px 28px rgba(5,150,105,0.65); transform: scale(1.03); } }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.15); border-radius: 3px; }

        /* Clinical Decision Support Panel */
        .clinical-support {
            border: 2px dashed #f59e0b !important;
            background: linear-gradient(135deg, rgba(245,158,11,0.03), rgba(217,119,6,0.02)) !important;
            border-radius: 12px;
            padding: 16px 20px;
            margin-top: 16px;
        }
        .clinical-support .cs-header {
            display: flex; align-items: center; gap: 8px; margin-bottom: 12px;
            font-weight: 700; color: #d97706; font-size: 14px;
        }
        .clinical-support .cs-warning {
            font-size: 10px; color: #92400e; background: rgba(245,158,11,0.12);
            padding: 3px 8px; border-radius: 4px; font-weight: 600;
        }
        .clinical-support .cs-section {
            margin-bottom: 14px; padding: 10px 12px;
            background: rgba(0,0,0,0.02); border-radius: 8px;
            border-left: 3px solid #f59e0b;
        }
        .clinical-support .cs-section h4 {
            margin: 0 0 6px 0; font-size: 13px; color: #92400e;
        }
        .clinical-support .cs-section pre {
            margin: 0; white-space: pre-wrap; font-size: 12px; line-height: 1.6;
            font-family: 'Segoe UI', system-ui, sans-serif; color: var(--text);
        }
        .clinical-support .cs-loading {
            display: flex; align-items: center; gap: 8px; color: #d97706;
            font-size: 13px; padding: 12px 0;
        }

        /* Lab Intelligence styles */
        .lab-intel-section summary { list-style: none; }
        .lab-intel-section summary::-webkit-details-marker { display: none; }
        .lab-intel-section[open] summary { margin-bottom: 8px; }
        .lab-status-badge {
            display: inline-block; padding: 2px 10px; border-radius: 10px;
            font-size: 11px; font-weight: 700;
        }
        .lab-status-normal { background: #dcfce7; color: #15803d; }
        .lab-status-high { background: #fee2e2; color: #dc2626; }
        .lab-status-low { background: #dbeafe; color: #2563eb; }
        .lab-status-critical { background: #fce7f3; color: #be185d; border: 1px solid #ec4899; }
        .lab-trend-up { color: #dc2626; font-weight: 700; }
        .lab-trend-down { color: #16a34a; font-weight: 700; }
        .lab-trend-stable { color: #64748b; }
        .lab-trend-card {
            padding: 10px 14px; border-radius: 8px; margin-bottom: 8px;
            border: 1px solid var(--border); background: rgba(0,0,0,0.01);
        }
        .lab-trend-card.worsening { border-left: 3px solid #ef4444; }
        .lab-trend-card.improving { border-left: 3px solid #22c55e; }
        .lab-trend-card.stable { border-left: 3px solid #94a3b8; }

        /* Digital Ink Prescription Pad */
        .ink-pad-card {
            border: 2px solid #8b5cf6 !important;
            background: linear-gradient(135deg, rgba(139,92,246,0.04), rgba(99,102,241,0.02)) !important;
        }
        .ink-canvas-wrap {
            position: relative;
            background: #fff;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            overflow: hidden;
            touch-action: none;
            cursor: crosshair;
        }
        .ink-canvas-wrap canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        .ink-toolbar {
            display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
            padding: 8px 0; border-bottom: 1px solid #e5e7eb; margin-bottom: 8px;
        }
        .ink-tool-btn {
            width: 36px; height: 36px; border-radius: 8px; border: 1px solid #d1d5db;
            background: #fff; cursor: pointer; font-size: 18px;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.12s; color: #4b5563;
        }
        .ink-tool-btn:hover { background: #f3f4f6; border-color: #9ca3af; }
        .ink-tool-btn.active { background: #ede9fe; border-color: #8b5cf6; color: #7c3aed; }
        .ink-tool-btn:disabled { opacity: 0.35; cursor: not-allowed; }
        .ink-color-dot {
            width: 22px; height: 22px; border-radius: 50%; border: 2px solid #d1d5db;
            cursor: pointer; transition: transform 0.1s; flex-shrink: 0;
        }
        .ink-color-dot:hover { transform: scale(1.2); }
        .ink-color-dot.active { border-color: #7c3aed; transform: scale(1.2); box-shadow: 0 0 0 2px rgba(139,92,246,0.3); }
        .ink-size-slider { width: 80px; accent-color: #7c3aed; }
        .ink-page-tabs { display: flex; gap: 2px; flex-wrap: wrap; }
        .ink-page-tab {
            padding: 4px 12px; font-size: 12px; border: 1px solid #d1d5db;
            border-radius: 6px 6px 0 0; background: #f9fafb; cursor: pointer;
            color: #6b7280;
        }
        .ink-page-tab.active { background: #fff; border-bottom-color: #fff; color: #7c3aed; font-weight: 600; }
        .ink-page-tab:hover { background: #f3f4f6; }

        /* Specialty checkboxes */
        .spec-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 8px; }
        .spec-item {
            display: flex; align-items: center; gap: 8px;
            padding: 10px 14px;
            background: rgba(0,0,0,0.02);
            border: 2px solid var(--border);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.15s;
            user-select: none;
        }
        .spec-item:hover { background: rgba(59,130,246,0.06); border-color: rgba(59,130,246,0.3); }
        .spec-item.selected { background: rgba(59,130,246,0.12); border-color: var(--primary); box-shadow: 0 0 0 2px rgba(59,130,246,0.15); }
        .spec-item input { display: none; }
        .spec-item label { margin: 0; cursor: pointer; font-weight: 500; pointer-events: none; }
        .spec-item .spec-check { 
            width: 20px; height: 20px; border-radius: 4px; border: 2px solid #ccc;
            display: flex; align-items: center; justify-content: center; flex-shrink: 0;
            font-size: 12px; transition: all 0.15s;
        }
        .spec-item.selected .spec-check { background: var(--primary); border-color: var(--primary); color: #fff; }

        /* Evidence verification badges */
        .ev-badge {
            display: inline-block; padding: 3px 10px; border-radius: 999px;
            font-size: 12px; font-weight: 700; margin: 4px 0;
        }
        .ev-verified {
            background: #d1fae5; color: #065f46; border: 1px solid #6ee7b7;
        }
        .ev-unverified {
            background: #fef3c7; color: #92400e; border: 1px solid #fcd34d;
        }
        .ev-section {
            margin-top: 10px; border: 1px solid var(--border); border-radius: 8px;
        }
        .ev-section summary {
            padding: 8px 12px; cursor: pointer; font-weight: 700; font-size: 13px;
            background: rgba(0,0,0,0.03); border-radius: 8px;
        }
        .ev-section pre {
            margin: 0; padding: 10px 12px; white-space: pre-wrap; word-break: break-word;
            font-family: inherit; font-size: 13px; color: #374151; background: #fff;
            border-radius: 0 0 8px 8px;
        }
        .ev-lib-table { width: 100%; border-collapse: collapse; font-size: 12px; }
        .ev-lib-table th, .ev-lib-table td {
            border: 1px solid var(--border); padding: 6px 8px; text-align: left; vertical-align: top;
        }
        .ev-lib-table th { background: rgba(139,92,246,0.08); color: #6d28d9; }

        /* ── Patient Progress Banner ── */
        .progress-banner {
            border-radius: var(--radius);
            padding: 16px;
            margin-bottom: 12px;
            border: 1px solid var(--border);
        }
        .progress-banner.improving { background: #f0fdf4; border-color: #86efac; }
        .progress-banner.worsening { background: #fef2f2; border-color: #fca5a5; }
        .progress-banner.mixed { background: #fefce8; border-color: #fde047; }
        .progress-banner .verdict { font-size: 16px; font-weight: 700; margin-bottom: 8px; }
        .progress-banner .verdict .arrow { font-size: 20px; }
        .progress-banner .param-grid { display: flex; gap: 12px; flex-wrap: wrap; }
        .progress-param {
            background: rgba(255,255,255,0.7);
            border-radius: 8px;
            padding: 8px 14px;
            min-width: 120px;
            border: 1px solid var(--border);
        }
        .progress-param .label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.3px; }
        .progress-param .value { font-size: 16px; font-weight: 700; }
        .progress-param .value .badge { font-size: 12px; margin-left: 6px; padding: 1px 8px; border-radius: 10px; }
        .badge-green { background: #86efac; color: #166534; }
        .badge-yellow { background: #fde047; color: #854d0e; }
        .badge-red { background: #fca5a5; color: #991b1b; }
        .badge-gray { background: #e2e8f0; color: #475569; }

        /* ── Mini SVG Chart ── */
        .mini-chart-wrap {
            background: rgba(255,255,255,0.8);
            border-radius: 8px;
            padding: 10px;
            border: 1px solid var(--border);
            margin-top: 8px;
        }
        .mini-chart-wrap svg { width: 100%; height: 80px; display: block; }
        .mini-chart-wrap .chart-title { font-size: 11px; color: var(--text-muted); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.3px; }

        /* ── MOBILE RESPONSIVE ── */
        @media (max-width: 768px) {
            .app { flex-direction: column; }
            .sidebar {
                width: 100%; height: auto; position: relative;
                padding: 10px; flex-direction: row; flex-wrap: wrap;
                gap: 4px; border-right: none; border-bottom: 1px solid var(--border);
            }
            .sb-header { width: 100%; padding: 4px 8px; border-bottom: none; margin-bottom: 0; }
            .sb-header h2 { font-size: 14px; }
            .nav-item { padding: 6px 10px; font-size: 12px; border-radius: 6px; }
            .nav-item .icon { font-size: 16px; }
            .main { flex: 1; }
            .content { padding: 16px; max-width: 100%; }
            .card { padding: 14px; }
            /* Form elements full-width */
            .form-grid { grid-template-columns: 1fr; }
            input, textarea, select { font-size: 16px !important; }
            /* Buttons bigger for touch */
            .btn, label[for] { padding: 10px 16px !important; font-size: 14px !important; min-height: 42px; }
            /* Flex containers stack */
            .flex-between, .flex { flex-direction: column; gap: 8px; }
            .flex-wrap { flex-wrap: wrap; }
            /* Hide sidebar scroll */
            .sidebar { overflow-x: auto; white-space: nowrap; }
            /* Token numbers smaller */
            .token { font-size: 14px; }
        }
        @media (max-width: 480px) {
            .sidebar { padding: 6px; gap: 2px; }
            .nav-item { padding: 4px 8px; font-size: 11px; }
            .content { padding: 10px; }
            h1 { font-size: 20px; }
            h2 { font-size: 16px; }
            .card { padding: 10px; border-radius: 8px; }
        }
    </style>
    <script src="https://js.puter.com/v2/"></script>
    <script src="/static/js/ai_gateway.js?v={{ build_stamp }}"></script>
</head>
