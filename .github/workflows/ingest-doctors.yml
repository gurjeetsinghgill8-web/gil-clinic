# Module 6 — Autonomous doctor-data ingestion (BLOCK 5 · M6-01)
#
# Why here and not on the web host: PythonAnywhere free blocks outbound
# internet except a whitelist, has no scheduled tasks (403), and gives the whole
# web app ~100 CPU-seconds a day. Chromium alone is ~400 MB against 512 MB of
# disk. So the crawler runs on GitHub's runners and posts results to the app.
#
# Setup (one time):
#   Repository → Settings → Secrets and variables → Actions:
#     INGEST_TOKEN     = same value the app's INGEST_TOKEN env var holds
#     GEMINI_API_KEY   = key for the extraction model
#
# The schedule is DISABLED until a real target is added to
# workers/crawl_doctors/targets.json — a cron that crawls an example.com
# placeholder every night is just noise.

name: Ingest doctor profiles

on:
  # Manual run — the safe default. Turn on the cron once targets.json is real.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Extract but do not post to the API"
        type: boolean
        default: true
      limit:
        description: "Max profiles to post (0 = no limit)"
        type: string
        default: "0"

  # Weekly crawl. ACTIVATION: real targets daalne ke baad ye comment hata do
  # (CRAWLER_ACTIVATION.md Step 3/4 dekho):
  # schedule:
  #   - cron: "30 20 * * 0"   # Sundays 02:00 IST (20:30 UTC Saturday)

# Never run two crawls at once — they would fight over the same clinic rows.
concurrency:
  group: ingest-doctors
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: workers/crawl_doctors/requirements.txt

      - name: Install worker dependencies
        working-directory: workers/crawl_doctors
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Chromium is what makes this a ~400 MB job — and exactly why it does
          # not belong on the web host.
          python -m playwright install --with-deps chromium

      - name: Run the worker
        working-directory: workers/crawl_doctors
        env:
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          API_BASE: https://gillhopitalsoftware1.pythonanywhere.com
          RUN_LABEL: gh-${{ github.run_number }}
        run: |
          ARGS="--config targets.json --verbose"
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          LIMIT="${{ github.event.inputs.limit }}"
          if [ -n "$LIMIT" ] && [ "$LIMIT" != "0" ]; then
            ARGS="$ARGS --limit $LIMIT"
          fi
          echo "running: python main.py $ARGS"
          python main.py $ARGS

      - name: Verify the run landed
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          base = "https://gillhopitalsoftware1.pythonanywhere.com"
          token = os.environ["INGEST_TOKEN"]
          url = f"{base}/api/v1/ingest/runs?token={token}&limit=1"
          with urllib.request.urlopen(url, timeout=60) as response:
              data = json.load(response)
          runs = data.get("runs") or []
          if not runs:
              raise SystemExit("no crawl run recorded — the post did not land")
          latest = runs[0]
          print("latest run:", json.dumps(latest, ensure_ascii=False))
          if latest.get("status") != "COMPLETED":
              raise SystemExit(f"run status is {latest.get('status')}")
          PY
